<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频运营工作台</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f4f9; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#7b8aa0;
  --line:#e5e9f0; --accent:#2563eb; --accent-soft:#e9efff;
  --ok:#16a34a; --ok-soft:#e6f7ed; --warn:#d97706; --warn-soft:#fef4e6;
  --bad:#dc2626; --bad-soft:#fdeaea; --r:16px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -22px rgba(15,23,42,.45);
}
html{min-height:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
::selection{background:#cfe0ff}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:11px 24px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-size:13px;box-shadow:0 8px 18px -8px rgba(37,99,235,.9)}
.brand .t1{font-weight:700;font-size:15px;letter-spacing:.2px;line-height:1.2}
.brand .t2{font-size:11.5px;color:var(--muted)}
.clockbox{padding-left:18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:0}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;letter-spacing:.4px;line-height:1.15}
.clockSub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -10px rgba(37,99,235,.9)}
.btn.primary:hover{background:#1d4ed8}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#eef2f8;color:var(--ink2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:#f4cccc}
.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* tabs */
.tabs{position:sticky;top:57px;z-index:25;display:flex;gap:4px;padding:10px 24px 0;background:linear-gradient(#f2f4f9 70%,rgba(242,244,249,0))}
.tab{padding:8px 16px;border-radius:11px 11px 0 0;font-weight:600;color:var(--muted);border:1px solid transparent;border-bottom:none;font-size:13.5px}
.tab:hover{color:var(--ink2)}
.tab.active{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:0 -1px 0 #fff}
.wrap{max-width:1500px;margin:0 auto;padding:6px 24px 70px}

/* layout */
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1.06fr .94fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:640px){
  .g4{grid-template-columns:1fr}
  .wrap{padding:6px 12px 60px}
  .topbar{padding:8px 12px;gap:8px;flex-wrap:wrap}
  .tabs{padding:8px 12px 0;overflow-x:auto}
  .clock{font-size:16px}
  .clockbox{padding-left:10px;border-left:none}
  .clockSub{white-space:normal;line-height:1.4}
  .brand .t2{display:none}
  .topbar .btn{padding:7px 10px;font-size:12.5px}
  .card{padding:13px 13px}
  .check{width:28px;height:28px;border-radius:9px;font-size:14px}
  .btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
  .rep{padding:11px;gap:9px}
  .rep .rice{width:30px;height:30px}
  .taskline{padding:11px 8px;flex-wrap:wrap;gap:8px;border:1px solid var(--line);margin-bottom:6px;background:#fff}
  .taskline .tl-title{flex:1 1 100%;white-space:normal;order:5;font-size:13.5px}
  .taskline .tag{font-size:12px}
  .day{padding:7px 2px}
  .day .dn{font-size:15px}
  .day .dc{font-size:10px}
  .days{gap:4px}
  .accrow{grid-template-columns:1fr;gap:5px;padding:10px 0}
  .accrow .num{text-align:left}
  .kpi .v{font-size:24px}
  .tbl-wrap{border:none;border-radius:0;overflow:visible}
  .tbl-wrap table{min-width:0;width:100%}
  thead{display:none}
  tbody tr{display:block;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;padding:10px 12px;background:#fff}
  tbody tr:hover{background:#fff}
  td{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border:none;font-size:13.5px}
  td::before{content:attr(data-label);color:var(--muted);font-weight:600;font-size:12px;flex:none}
  td:last-child{justify-content:flex-end;border-top:1px dashed var(--line);margin-top:4px;padding-top:9px}
  td:last-child::before{display:none}
  .heat-scroll{padding-bottom:8px}
  .dlg-b{padding:10px 16px}
  .row2{grid-template-columns:1fr}
  .srow{flex-direction:column;align-items:flex-start;gap:6px}
  .srow .sl{width:auto}
  .accitem{gap:6px}
  #toast{left:12px;right:12px;transform:translateY(14px)}
  #toast.show{transform:none}
}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.chead h2{font-size:14.5px;font-weight:700;letter-spacing:.2px}
.chead .sub{font-size:12px;color:var(--muted)}
.chead .right{margin-left:auto;display:flex;align-items:center;gap:6px}

/* kpi */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:27px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.25;margin-top:2px}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .mini{margin-top:9px}

/* progress */
.bar{height:7px;border-radius:99px;background:#eef1f6;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease}
.bar.ok>i{background:var(--ok)}
.bar.warn>i{background:var(--warn)}
.bar.bad>i{background:var(--bad)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:#eef2f8;color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:#15803d}
.pill.warn{background:var(--warn-soft);color:#b45309}
.pill.bad{background:var(--bad-soft);color:#b91c1c}
.pill.acc{background:var(--accent-soft);color:#1d4ed8}
.pill.grey{background:#f1f5f9;color:#64748b}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* today task list */
.taskline{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;border:1px solid transparent;transition:.15s}
.taskline:hover{background:#f8fafc;border-color:var(--line)}
.taskline .tl-acc{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f1f5f9;color:var(--ink2);white-space:nowrap}
.taskline .tl-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.taskline.done .tl-title{color:var(--muted);text-decoration:line-through}
.taskline.late{background:#fff5f5}
.taskline.late .tl-title{color:#b91c1c}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}
.empty .big{font-size:30px;margin-bottom:6px;opacity:.5}

/* week strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{border:1px solid var(--line);border-radius:12px;padding:8px 6px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:.15s}
.day:hover{border-color:#c7d2fe;transform:translateY(-1px);box-shadow:0 6px 14px -10px rgba(37,99,235,.6)}
.day .dw{font-size:11px;color:var(--muted);font-weight:600}
.day .dn{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.day .dc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.day.rest{background:#f8fafc}
.day.rest .dn{color:#94a3b8}
.day .flag{position:absolute;top:4px;right:5px;font-size:9.5px;color:#94a3b8;font-weight:700}
.day .okdot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--ok)}
.day.full{background:var(--ok-soft);border-color:#bfe6cd}

/* month account rows */
.accrow{display:grid;grid-template-columns:130px 1fr 92px;gap:12px;align-items:center;padding:8px 0}
.accrow .an{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;min-width:0}
.accrow .an span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accrow .num{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:640px){.accrow{grid-template-columns:96px 1fr 74px;gap:8px}}

/* table */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sel,.inp{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:13px;outline:none;transition:.15s}
.sel:focus,.inp:focus{border-color:#bfd3ff;box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:#a9b4c4}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfd}
td{padding:9px 10px;border-bottom:1px solid #f1f4f9;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfe}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.tbl-wrap table{min-width:760px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;cursor:pointer;user-select:none}
.tag.s0{background:#f1f5f9;color:#475569}
.tag.s1{background:var(--accent-soft);color:#1d4ed8}
.tag.s2{background:#f5f0ff;color:#6d28d9}
.tag.s3{background:var(--ok-soft);color:#15803d}
.tag.s4{background:#f1f5f9;color:#94a3b8}
.tag.p0{background:#fee2e2;color:#b91c1c}
.tag.p1{background:#fef3c7;color:#b45309}
.tag.p2{background:#eef2f8;color:#64748b}
.due-late{color:var(--bad);font-weight:600}
.due-today{color:var(--accent);font-weight:600}

/* reports */
.rep{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;transition:.15s}
.rep.filled{background:linear-gradient(180deg,#f7fdf9,#fff);border-color:#c9ebd5}
.rep.overdue{border-color:#f5c2c2;background:#fff8f8}
.rep .rice{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:#f1f5f9;flex:none}
.rep.filled .rice{background:var(--ok-soft)}
.rep .rmain{flex:1;min-width:0}
.rep .rt{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rep .rs{font-size:11.5px;color:var(--muted);margin-top:1px}
.check{width:22px;height:22px;border-radius:7px;border:1.8px solid #cbd5e1;display:grid;place-items:center;flex:none;transition:.15s;background:#fff}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check:hover{border-color:var(--ok)}
.heat-scroll{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;gap:3px;font-size:10px;min-width:max-content}
.hc{width:20px;height:20px;border-radius:5px;background:#f1f5f9;border:1px solid transparent;transition:.12s;display:grid;place-items:center;font-size:9px;color:#94a3b8}
.hc:hover{transform:scale(1.15)}
.hc.on{background:#34d399;color:#fff}
.hc.miss{background:#fde8e8;border-color:#f6cfcf;color:#c98b8b}
.hc.future{background:#fbfcfe;color:#dde3ec}
.hc.today{outline:2px solid var(--accent);outline-offset:1px}
.hlabel{font-size:11px;color:var(--muted);text-align:center}
.hacc{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}

/* settings */
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #eef1f6}
.srow:last-child{border-bottom:none}
.srow .sl{width:170px;flex:none;font-size:13px;color:var(--ink2);font-weight:600}
.srow .sr{flex:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--muted)}
.accitem{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed #eef1f6;flex-wrap:wrap}
.accitem .c{width:12px;height:12px;border-radius:4px;flex:none}
.accitem input{min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* auth */
#authMask{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(242,244,249,.95);backdrop-filter:blur(8px)}
#authMask.show{display:flex}
.authCard{width:min(390px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 24px 60px -30px rgba(15,23,42,.5)}
.authCard h3{font-size:17px;margin:12px 0 4px}
.authCard .field{margin-top:12px}
.authCard .btn{width:100%;justify-content:center;margin-top:10px}
#syncChip{font-size:11px;padding:3px 9px}
@media(max-width:640px){#syncChip{display:none}}

/* dialog */
dialog{border:none;border-radius:18px;padding:0;width:min(460px,92vw);box-shadow:0 30px 70px -30px rgba(15,23,42,.6);background:#fff}
dialog::backdrop{background:rgba(15,23,42,.35);backdrop-filter:blur(2px)}
.dlg-h{padding:18px 20px 0;font-size:16px;font-weight:750}
.dlg-b{padding:14px 20px;display:flex;flex-direction:column;gap:11px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;outline:none;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#bfd3ff;box-shadow:0 0 0 3px var(--accent-soft)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:11px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 14px 40px -14px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:#a8b3c4;font-size:11.5px;padding:18px 0 0}

/* alert */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;font-size:12.5px;line-height:1.6;border:1px solid}
.alert.ok{background:#f4fdf7;border-color:#cfefdb;color:#166534}
.alert.warn{background:#fffbf3;border-color:#fbe6c4;color:#92400e}
.alert.bad{background:#fff6f6;border-color:#fbd5d5;color:#991b1b}
.alert .ico{font-size:14px;line-height:1.4}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">▶</div>
    <div>
      <div class="t1">视频运营工作台</div>
      <div class="t2" id="brandSub">加载中…</div>
    </div>
  </div>
  <div class="clockbox">
    <div class="clock" id="clock">--:--:--</div>
    <div class="clockSub" id="clockSub">&nbsp;</div>
  </div>
  <div class="spacer"></div>
  <span class="pill grey" id="syncChip">本地模式</span>
  <button class="btn" data-act="genToday">⚡ 生成今日任务</button>
  <button class="btn primary" data-act="newTask">＋ 新增任务</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="overview">总览</button>
  <button class="tab" data-tab="tasks">任务</button>
  <button class="tab" data-tab="reports">报表台账</button>
  <button class="tab" data-tab="settings">设置</button>
</nav>

<div class="wrap">
  <!-- 总览 -->
  <section class="view active" id="view-overview">
    <div class="grid g4" id="kpis"></div>
    <div class="grid g2">
      <section class="card" id="todayCard"></section>
      <section class="card" id="weekCard"></section>
    </div>
    <section class="card" id="monthCard"></section>
    <div class="grid" id="lateWrap"></div>
    <div class="foot">数据保存在本机浏览器 · 建议每周在「设置 → 数据」里导出一次备份</div>
  </section>

  <!-- 任务 -->
  <section class="view" id="view-tasks">
    <section class="card">
      <div class="chead">
        <h2>全部任务</h2><span class="sub" id="taskCount"></span>
        <div class="right"><button class="btn sm" data-act="genToday">⚡ 生成今日任务</button></div>
      </div>
      <div class="toolbar">
        <select class="sel" id="fAcc" data-act="filter"></select>
        <select class="sel" id="fStatus" data-act="filter"></select>
        <input class="inp" id="fSearch" placeholder="搜索任务名 / 备注" style="min-width:180px" data-act="filter">
        <label class="chip" id="fLate" data-act="toggleLate">只看逾期</label>
        <div class="spacer"></div>
        <button class="btn" data-act="newTask">＋ 新增任务</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th style="width:130px">账号</th><th>任务</th><th style="width:110px">截止</th><th style="width:96px">状态</th><th style="width:76px">优先级</th><th style="width:136px">操作</th></tr></thead>
        <tbody id="taskBody"></tbody>
      </table></div>
    </section>
  </section>

  <!-- 报表台账 -->
  <section class="view" id="view-reports">
    <div class="grid g2">
      <section class="card">
        <div class="chead"><h2>今日交作业</h2><span class="sub" id="repTodaySub"></span><div class="right" id="repTodayScore"></div></div>
        <div id="repToday" style="display:flex;flex-direction:column;gap:9px"></div>
        <div class="chead" style="margin:20px 0 12px"><h2>本周 / 本月</h2></div>
        <div id="repPeriod" style="display:flex;flex-direction:column;gap:9px"></div>
      </section>
      <section class="card">
        <div class="chead"><h2>补填</h2><span class="sub">漏掉的可以在这里补勾</span></div>
        <div id="makeupList" style="display:flex;flex-direction:column;gap:7px;max-height:330px;overflow:auto"></div>
      </section>
    </div>
    <section class="card">
      <div class="chead"><h2>台账热力图</h2><span class="sub" id="heatSub"></span>
        <div class="right"><span class="pill ok" style="font-size:11px">已填</span><span class="pill bad" style="font-size:11px">漏填</span></div>
      </div>
      <div class="heat-scroll" id="heatmap"></div>
    </section>
  </section>

  <!-- 设置 -->

<script>
(function(){
'use strict';

/* ---------------- 基础工具 ---------------- */
const $ = s => document.querySelector(s);
const DOW = ['周日','周一','周二','周三','周四','周五','周六'];
const DOW1 = ['日','一','二','三','四','五','六'];
const STATUSES = ['未开始','进行中','待审核','已完成','已搁置'];
const PRIOS = ['高','中','低'];
const uid = () => Math.random().toString(36).slice(2,9);

const P = ds => { const p = ds.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const I = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addS = (ds,n) => I(addD(P(ds),n));
const diffD = (a,b) => Math.round((P(b)-P(a))/86400000);
const TODAY = () => I(new Date());
const md = ds => { const d = P(ds); return (d.getMonth()+1)+'.'+d.getDate(); };
const num = n => (Math.round(n*10)/10).toString();
const pct = (a,b) => b>0 ? Math.min(100, Math.round(a/b*100)) : 0;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}
function download(name, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 400);
}

/* ============================================================================
   想改这个工作台？看这三行就够：
   1) 账号 / 周期 / 大小周 / 考核日 / 文档链接 —— 直接进页面「设置」改，改完自动保存，不用碰代码。
   2) 想改出厂预置值（第一次打开时的样子）—— 改下面 seed() 函数里的内容。
   3) 想在同一台电脑上放两份互不干扰的副本（比如给别人用的演示版）—— 改下面 KEY 那行的字符串，
      两份文件用不同的 KEY，数据就各存各的。
   ============================================================================ */

/* ---------------- 状态 ---------------- */
const KEY = 'vops.workbench.v3';

function seed(){
  return {
    v: 2,
    accounts: [
      {id:'a1', name:'账号1', kind:'自营', note:'科技类营销号', cadence:1, color:'#2563eb', ledgerUrl:'', enabled:true},
      {id:'a2', name:'账号2',  kind:'合作', note:'合作账号',   cadence:1, color:'#0d9488', ledgerUrl:'', enabled:true},
      {id:'a3', name:'账号3', kind:'合作', note:'合作账号', cadence:1, color:'#ea580c', ledgerUrl:'', enabled:true}
    ],
    cycles: [
      {id:'c1', label:'10.19–11.18', start:'2026-10-19', end:'2026-11-18', assess:'2026-11-18', target:40},
      {id:'c2', label:'11.19–12.18', start:'2026-11-19', end:'2026-12-18', assess:'2026-12-18', target:40}
    ],
    anchor: {weekStart:'2026-11-16', type:'small'},
    overrides: {},
    restDays: {small:[0], big:[0,6]},
    postOnRest: false,
    due: {daily:'18:00', weekly:'23:59', monthly:'23:59'},
    links: {daily:'', weekly:'', monthly:''},
    tasks: [],
    reports: {}
  };
}

let state;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return seed();
    const s = JSON.parse(raw);
    return Object.assign(seed(), s);
  }catch(e){ console.warn(e); return seed(); }
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ console.warn(e); } }
function save(){ saveLocal(); scheduleSync(); }

/* ---------------- 云端账号与同步（Supabase） ---------------- */
const CFG = { url: 'https://tqrdetbuferecxqhadli.supabase.co', key: 'sb_publishable_bj-iQkqabaG39cFDwC64rw_6VO64SYq', table: 'states' };
const SK = 'vops.session.v1';
let SESSION = null, syncTimer = null, syncing = false, booting = false;

function hasCloud(){ return !!(CFG.url && CFG.key); }
function setSync(t, cls){ const el=$('#syncChip'); if(!el) return; el.textContent=t; el.className='pill '+(cls||'grey'); }
function loadSession(){ try{ return JSON.parse(localStorage.getItem(SK)||'null'); }catch(e){ return null; } }
function saveSession(s){ try{ if(s) localStorage.setItem(SK, JSON.stringify(s)); else localStorage.removeItem(SK); }catch(e){} }
function authErr(msg){ const e=$('#authErr'); if(e) e.textContent = msg||''; }

async function sbFetch(path, opts){
  opts = opts||{};
  const headers = Object.assign({ 'apikey': CFG.key, 'Content-Type': 'application/json' }, opts.headers||{});
  if(opts.auth !== false) headers['Authorization'] = 'Bearer ' + (opts.token || (SESSION && SESSION.access_token) || CFG.key);
  const res = await fetch(CFG.url + path, { method: opts.method||'GET', headers, body: opts.body });
  const txt = await res.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
  if(!res.ok){
    const msg = (data && (data.error_description || data.msg || data.message || data.hint)) || ('HTTP '+res.status);
    throw new Error(msg);
  }
  return data;
}

async function ensureToken(){
  if(!SESSION) throw new Error('未登录');
  if(Date.now() < (SESSION.expires_at||0) - 60000) return SESSION.access_token;
  const r = await sbFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', auth:false, token: CFG.key, body: JSON.stringify({refresh_token: SESSION.refresh_token})});
  SESSION.access_token = r.access_token;
  if(r.refresh_token) SESSION.refresh_token = r.refresh_token;
  SESSION.expires_at = Date.now() + (r.expires_in||3600)*1000;
  saveSession(SESSION);
  return SESSION.access_token;
}

async function pullState(){
  const tk = await ensureToken();
  const rows = await sbFetch('/rest/v1/'+CFG.table+'?select=data&user_id=eq.'+SESSION.user.id, {token: tk});
  return (Array.isArray(rows) && rows.length) ? rows[0].data : null;
}

async function pushState(){
  const tk = await ensureToken();
  await sbFetch('/rest/v1/'+CFG.table, {
    method:'POST', token: tk,
    headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ user_id: SESSION.user.id, data: state, updated_at: new Date().toISOString() })
  });
}

function scheduleSync(){
  if(!hasCloud() || !SESSION || booting) return;
  clearTimeout(syncTimer);
  setSync('待同步','warn');
  syncTimer = setTimeout(doSync, 1500);
}

async function doSync(){
  if(!hasCloud() || !SESSION || syncing) return;
  syncing = true; setSync('同步中','acc');
  try{
    await pushState();
    setSync('已同步','ok');
  }catch(e){
    setSync('离线待同步','warn');
    clearTimeout(syncTimer); syncTimer = setTimeout(doSync, 20000);
  }finally{ syncing = false; }
}

async function doLogin(signup){
  authErr('');
  const email = ($('#authEmail').value||'').trim();
  const pass = ($('#authPass').value||'');
  if(!email || !pass){ authErr('请填写邮箱和密码'); return; }
  if(pass.length < 6){ authErr('密码至少 6 位'); return; }
  const b1 = $('#authLogin'), b2 = $('#authSignup');
  b1.disabled = true; b2.disabled = true; b1.textContent = '处理中…';
  try{
    const path = signup ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
    const r = await sbFetch(path, {method:'POST', auth:false, token: CFG.key, body: JSON.stringify({email, password: pass})});
    if(!r || !r.access_token){
      authErr(signup ? '注册成功，但还要求邮箱验证。请让管理员在 Supabase 关掉邮箱验证后重试。' : '登录失败，请检查邮箱密码');
      return;
    }
    SESSION = { access_token: r.access_token, refresh_token: r.refresh_token, expires_at: Date.now()+(r.expires_in||3600)*1000, user: r.user };
    saveSession(SESSION);
    await afterLogin();
  }catch(e){
    authErr(String(e.message||e));
  }finally{
    b1.disabled = false; b2.disabled = false; b1.textContent = '登录';
  }
}

async function afterLogin(){
  booting = true;
  setSync('同步中','acc');
  try{
    const remote = await pullState();
    if(remote){ state = Object.assign(seed(), remote); saveLocal(); render(); }
    else { await pushState(); }
    $('#authMask').classList.remove('show');
    setSync('已同步','ok');
  }catch(e){
    setSync('连接失败','bad');
    authErr('连不上云端：'+String(e.message||e));
    $('#authMask').classList.add('show');
    throw e;
  }finally{ booting = false; }
}

function bootAuth(){
  if(!hasCloud()){ setSync('本地模式','grey'); return; }
  SESSION = loadSession();
  if(SESSION && SESSION.user){ afterLogin().catch(function(){}); }
  else { $('#authMask').classList.add('show'); }
}

function logout(){
  SESSION = null; saveSession(null);
  try{ localStorage.removeItem(KEY); }catch(e){}
  location.reload();
}

/* ---------------- 周期逻辑 ---------------- */
function weekStartOf(ds){
  const d = P(ds), dow = d.getDay();
  return I(addD(d, dow===0 ? -6 : 1-dow));
}
function weekType(ws){
  if(state.overrides[ws]) return state.overrides[ws];
  const off = Math.round(diffD(state.anchor.weekStart, ws)/7);
  const even = ((off%2)+2)%2 === 0;
  const base = even ? state.anchor.type : (state.anchor.type==='small'?'big':'small');
  return base;
}
function isRest(ds){
  const t = weekType(weekStartOf(ds));
  return (state.restDays[t]||[]).indexOf(P(ds).getDay()) >= 0;
}
function activeAccounts(){ return state.accounts.filter(a=>a.enabled); }
function dailyTarget(ds){
  const base = activeAccounts().reduce((s,a)=> s + (Number(a.cadence)||1), 0);
  if(isRest(ds) && !state.postOnRest) return 0;
  return base;
}
function sumTarget(a,b){
  let n = 0, cur = a;
  while(cur <= b){ n += dailyTarget(cur); cur = addS(cur,1); }
  return n;
}
function doneIn(a,b,accId){
  return state.tasks.filter(t => t.status==='已完成' && t.due >= a && t.due <= b && (!accId || t.accountId===accId)).length;
}
function cycleFor(ds){
  const hit = state.cycles.find(c => c.start <= ds && ds <= c.end);
  if(hit) return hit;
  const next = state.cycles.filter(c => c.start > ds).sort((x,y)=> x.start>y.start?1:-1)[0];
  if(next) return next;
  return state.cycles.slice().sort((x,y)=> x.end<y.end?1:-1)[0];
}
function cycleLabel(c){ return md(c.start)+'–'+md(c.end); }
function accOf(id){ return state.accounts.find(a=>a.id===id); }
function accName(id){ const a = accOf(id); return a ? a.name : '未分配'; }
function accColor(id){ const a = accOf(id); return a ? a.color : '#94a3b8'; }

/* ---------------- 报表键 ---------------- */
const rk = {
  daily: d => 'd|'+d,
  weekly: ws => 'w|'+ws,
  monthly: c => 'm|'+c.id,
  ledger: (d,a) => 'l|'+d+'|'+a
};
function isFilled(k){ return !!state.reports[k]; }
function toggleReport(k){ if(state.reports[k]) delete state.reports[k]; else state.reports[k] = new Date().toISOString(); save(); render(); }

/* ---------------- 渲染：顶部 ---------------- */
function renderClock(){
  const now = new Date();
  const p = n => String(n).padStart(2,'0');
  $('#clock').textContent = p(now.getHours())+':'+p(now.getMinutes())+':'+p(now.getSeconds());
  const t = TODAY();
  const ws = weekStartOf(t), we = addS(ws,6);
  const c = cycleFor(t);
  const wt = weekType(ws);
  const restTxt = (state.restDays[wt]||[]).length ? ((state.restDays[wt]||[]).map(d=>'周'+DOW1[d]).join('、')+'休') : '无休';
  const isAssess = c && c.assess === t;
  $('#clockSub').innerHTML = `${P(t).getFullYear()}年${P(t).getMonth()+1}月${P(t).getDate()}日 ${DOW[P(t).getDay()]} · 本周 ${md(ws)}–${md(we)}（${wt==='small'?'小周':'双周'}·${restTxt}） · 周期 ${cycleLabel(c)}${isAssess?' · <b style="color:#dc2626">今天考核</b>':''}`;
  $('#brandSub').textContent = `${activeAccounts().length} 个账号 · 每天 ${activeAccounts().reduce((s,a)=>s+(Number(a.cadence)||1),0)} 条 · 月保底 ${c?c.target:40} 条`;
}

/* ---------------- 渲染：总览 ---------------- */
function renderOverview(){
  const t = TODAY();
  const curWS = weekStartOf(t), curWE = addS(curWS,6);
  const curCycle = cycleFor(t);
  const ws = UI.weekStart || curWS, we = addS(ws,6);
  const c = state.cycles.find(x=>x.id===UI.cycleId) || curCycle;

  const dayT = dailyTarget(t), dayD = doneIn(t,t);
  const wT = sumTarget(curWS,curWE), wD = doneIn(curWS,curWE);
  const mD = doneIn(curCycle.start, curCycle.end);
  const calcM = sumTarget(curCycle.start, curCycle.end);
  const mOver = mD - curCycle.target;

  // 今日交作业
  const dayReports = [rk.daily(t), ...activeAccounts().map(a=>rk.ledger(t,a.id))];
  const repDone = dayReports.filter(isFilled).length;

  const barCls = (d,tt) => tt===0 ? '' : (d>=tt ? 'ok' : (d/tt >= .7 ? 'warn':'bad'));

  $('#kpis').innerHTML = `
    <div class="kpi">
      <div class="k">今日产出 <span class="pill ${isRest(t)&&!state.postOnRest?'grey':'acc'}" style="font-size:10.5px">${isRest(t)&&!state.postOnRest?'休息日':'工作日'}</span></div>
      <div class="v">${dayD}<small> / ${dayT}</small></div>
      <div class="mini"><div class="bar ${dayD>=dayT?'ok':''}"><i style="width:${pct(dayD,dayT)}%"></i></div></div>
      <div class="n">${dayT===0 ? '今天不算工作量' : (dayD>=dayT ? '今天的量已完成' : '还差 '+ (dayT-dayD) +' 条')}</div>
    </div>
    <div class="kpi">
      <div class="k">本周 ${md(ws)}–${md(we)}</div>
      <div class="v">${wD}<small> / ${wT}</small></div>
      <div class="mini"><div class="bar ${barCls(wD,wT)}"><i style="width:${pct(wD,wT)}%"></i></div></div>
      <div class="n">${wT===0?'本周休息为主':(wD>=wT?'已达标':'完成 '+pct(wD,wT)+'%，还差 '+(wT-wD)+' 条')}</div>
    </div>
    <div class="kpi">
      <div class="k">本月周期 ${cycleLabel(curCycle)}</div>
      <div class="v">${mD}<small> / ${curCycle.target} 保底</small></div>
      <div class="mini"><div class="bar ${mOver>=0?'ok':barCls(mD,curCycle.target)}"><i style="width:${pct(mD,curCycle.target)}%"></i></div></div>
      <div class="n">${mOver>=0 ? '已达标，超额 +'+mOver+' 条' : '还差 '+(-mOver)+' 条'}</div>
    </div>
    <div class="kpi">
      <div class="k">今日交作业</div>
      <div class="v">${repDone}<small> / ${dayReports.length}</small></div>
      <div class="mini"><div class="bar ${repDone>=dayReports.length?'ok':'warn'}"><i style="width:${pct(repDone,dayReports.length)}%"></i></div></div>
      <div class="n">${repDone>=dayReports.length?'今天的都交齐了':'日报 / 台账还没交完'}</div>
    </div>`;

  renderTodayCard(t);
  renderWeekCard(ws,we);
  renderMonthCard(c);

  // 逾期
  const late = state.tasks.filter(x => x.status!=='已完成' && x.status!=='已搁置' && x.due < t).sort((a,b)=> a.due<b.due?-1:1);
  $('#lateWrap').innerHTML = late.length ? `
    <section class="card">
      <div class="chead"><h2>逾期未完成</h2><span class="pill bad">${late.length} 条</span>
        <div class="right"><button class="btn sm" data-act="goTasks">去任务表</button></div></div>
      ${late.slice(0,8).map(x=>`
        <div class="taskline late">
          <span class="tl-acc" style="color:${accColor(x.accountId)}">${esc(accName(x.accountId))}</span>
          <span class="tl-title">${esc(x.title)}</span>
          <span class="pill bad" style="font-size:11px">逾期 ${diffD(x.due,t)} 天</span>
          <button class="btn sm" data-act="quickDone" data-id="${x.id}">完成</button>
        </div>`).join('')}
      ${late.length>8?`<div class="hint" style="padding:6px 10px">还有 ${late.length-8} 条，去任务表查看</div>`:''}
    </section>` : '';
}

function renderTodayCard(t){
  const list = state.tasks.filter(x => (x.due === t || (x.due < t && x.status!=='已完成' && x.status!=='已搁置')))
    .sort((a,b)=> (a.due===t?0:1)-(b.due===t?0:1) || PRIOS.indexOf(a.priority)-PRIOS.indexOf(b.priority));
  const tgt = dailyTarget(t);
  const done = doneIn(t,t);
  const rest = isRest(t) && !state.postOnRest;
  $('#todayCard').innerHTML = `
    <div class="chead">
      <h2>今日 · ${md(t)} ${DOW[P(t).getDay()]}</h2>
      <span class="pill ${rest?'grey':'acc'}">${rest?'休息日':'应有 '+tgt+' 条'}</span>
      ${tgt>0?`<span class="pill ${done>=tgt?'ok':'warn'}">${done}/${tgt}</span>`:''}
      <div class="right"><button class="btn sm" data-act="newTask">＋ 加一条</button></div>
    </div>
    ${list.length ? `<div style="display:flex;flex-direction:column;gap:2px">${list.map(x=>taskLine(x,t)).join('')}</div>`
      : `<div class="empty"><div class="big">🗒</div>今天还没有任务${tgt>0?'，点右上角「生成今日任务」一键铺好':'。今天休息，想加也能加'}</div>`}`;
}

function taskLine(x,t){
  const late = x.due < t && x.status!=='已完成';
  return `<div class="taskline ${x.status==='已完成'?'done':''} ${late?'late':''}">
    <span class="dot" style="background:${accColor(x.accountId)}"></span>
    <span class="tl-acc">${esc(accName(x.accountId))}</span>
    <span class="tl-title">${esc(x.title)}${x.note?` <span class="hint">· ${esc(x.note)}</span>`:''}</span>
    ${late?`<span class="pill bad" style="font-size:10.5px">逾期${diffD(x.due,t)}天</span>`:''}
    <span class="tag s${STATUSES.indexOf(x.status)}" data-act="cycleStatus" data-id="${x.id}">${x.status}</span>
    ${x.status!=='已完成'?`<button class="btn sm" data-act="quickDone" data-id="${x.id}">✓</button>`:''}
  </div>`;
}

function renderWeekCard(ws,we){
  const t = TODAY();
  const wt = weekType(ws);
  const days = Array.from({length:7},(_,i)=>addS(ws,i));
  const wT = sumTarget(ws,we), wD = doneIn(ws,we);
  const isCurWeek = ws === weekStartOf(t);
  const past = we < t;
  let cap = 0, dcount = 0;
  if(isCurWeek){
    let cur = t;
    while(cur <= we){ const dt = dailyTarget(cur); cap += dt; if(dt>0) dcount++; cur = addS(cur,1); }
  }
  const need = Math.max(0, wT - wD);

  let alert;
  if(need<=0) alert = `<div class="alert ok"><span class="ico">✓</span><div>${past?'该周':'本周'}目标已全部完成（${wD}/${wT}）。</div></div>`;
  else if(past) alert = `<div class="alert bad"><span class="ico">!</span><div>这周已经结束，最终完成 <b>${wD}/${wT}</b>，差 ${need} 条。</div></div>`;
  else if(cap>=need) alert = `<div class="alert warn"><span class="ico">⏳</span><div>还差 <b>${need}</b> 条，本周剩余还能做 <b>${cap}</b> 条 —— 每天保持 ${num(cap/Math.max(1,dcount))} 条就能追平。</div></div>`;
  else alert = `<div class="alert bad"><span class="ico">!</span><div>还差 <b>${need}</b> 条，但剩余时间最多只能再做 <b>${cap}</b> 条，<b>差 ${need-cap} 条追不回来</b>，看要不要调休或加更。</div></div>`;

  const wkRep = isFilled(rk.weekly(ws));

  $('#weekCard').innerHTML = `
    <div class="chead">
      <h2>${isCurWeek?'本周':'该周'} ${md(ws)}–${md(we)}</h2>
      <span class="pill ${wt==='small'?'acc':'grey'}">${wt==='small'?'小周·单休':'双周·双休'}</span>
      ${past?'<span class="pill grey">已结束</span>':''}
      <div class="right">
        <button class="btn sm ghost" data-act="moveWeek" data-n="-1">‹ 上周</button>
        <button class="btn sm ghost" data-act="moveWeek" data-n="1">下周 ›</button>
      </div>
    </div>
    <div class="days">${days.map(d=>{
      const dt = dailyTarget(d), dd = doneIn(d,d), rest = isRest(d) && !state.postOnRest;
      const full = dt>0 && dd>=dt;
      return `<button class="day ${d===t?'today':''} ${rest?'rest':''} ${full?'full':''}" data-act="focusDay" data-d="${d}">
        <span class="dw">周${DOW1[P(d).getDay()]}</span>
        <span class="dn">${P(d).getDate()}</span>
        <span class="dc">${rest?'休':dd+'/'+dt}</span>
        ${full?'<span class="okdot"></span>':''}
      </button>`;
    }).join('')}</div>
    <div style="display:flex;align-items:center;gap:12px;margin:14px 0 10px">
      <div class="bar ${wD>=wT?'ok':''}" style="flex:1;height:9px"><i style="width:${pct(wD,wT)}%"></i></div>
      <b style="font-variant-numeric:tabular-nums">${wD}/${wT}</b>
      <span class="hint">${pct(wD,wT)}%</span>
    </div>
    ${alert}
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <span class="hint">周报</span>
      <button class="chip ${wkRep?'on':''}" data-act="toggleReport" data-k="${rk.weekly(ws)}">${wkRep?'✓ 已填':'未填'}</button>
      <span class="hint">截止 周期最后一天 ${state.due.weekly}</span>
    </div>`;
}

function renderMonthCard(c){
  const t = TODAY();
  const mD = doneIn(c.start, c.end);
  const calc = sumTarget(c.start, c.end);
  const over = mD - c.target;
  const daysLeft = Math.max(0, diffD(t, c.end));
  const isNow = c.start <= t && t <= c.end;
  const assessToday = c.assess === t;

  let alert;
  if(over>=0) alert = `<div class="alert ok"><span class="ico">✓</span><div>保底 ${c.target} 条已达成，当前 ${mD} 条（超额 +${over}）。按日更节奏推算本周期应做 ${calc} 条。</div></div>`;
  else if(!isNow) alert = `<div class="alert warn"><span class="ico">·</span><div>该周期已完成，最终 ${mD}/${c.target}。</div></div>`;
  else alert = `<div class="alert ${daysLeft<=3?'bad':'warn'}"><span class="ico">!</span><div>还差 <b>${c.target-mD}</b> 条到保底，本周期还剩 <b>${daysLeft}</b> 天（含今天）。按日更推算全周期约 ${calc} 条。</div></div>`;

  const rows = activeAccounts().map(a=>{
    const d = doneIn(c.start,c.end,a.id);
    const tt = activeAccounts().length ? Math.round(calc/activeAccounts().length) : 0;
    return `<div class="accrow">
      <div class="an"><span class="dot" style="background:${a.color}"></span><span>${esc(a.name)}</span></div>
      <div class="bar" style="height:8px"><i style="width:${pct(d,tt)}%;background:${a.color}"></i></div>
      <div class="num">${d} 条 <span class="hint">/ 推算 ${tt}</span></div>
    </div>`;
  }).join('');

  $('#monthCard').innerHTML = `
    <div class="chead">
      <h2>${c.id===cycleFor(t).id?'本周期':'该周期'} ${c.start.slice(0,4)}.${cycleLabel(c)}</h2>
      <span class="pill ${assessToday?'bad':'acc'}">考核日 ${md(c.assess)}${assessToday?'（今天）':''}</span>
      <span class="pill grey">保底 ${c.target} 条</span>
      <div class="right">
        <button class="btn sm ghost" data-act="moveCycle" data-n="-1">‹</button>
        <button class="btn sm ghost" data-act="moveCycle" data-n="1">›</button>
      </div>
    </div>
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:10px">
      <div style="font-size:32px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-1px">${mD}</div>
      <div style="color:var(--muted)">/ ${c.target} 条</div>
      <div style="margin-left:auto;font-size:12px;color:var(--muted)">本周期共 ${diffD(c.start,c.end)+1} 天${isNow?(daysLeft===0?'，今天是最后一天':`，还剩 ${daysLeft} 天`):''}</div>
    </div>
    <div class="bar ${over>=0?'ok':''}" style="height:10px;margin-bottom:14px"><i style="width:${pct(mD,c.target)}%;background:linear-gradient(90deg,#2563eb,#7c3aed)"></i></div>
    ${alert}
    <div style="margin-top:14px">${rows}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <span class="hint">月报</span>
      <button class="chip ${isFilled(rk.monthly(c))?'on':''}" data-act="toggleReport" data-k="${rk.monthly(c)}">${isFilled(rk.monthly(c))?'✓ 已填':'未填'}</button>
      <span class="hint">考核日 ${md(c.assess)} 前</span>
    </div>`;
}

/* ---------------- 渲染：任务表 ---------------- */
function renderTasks(){
  const accSel = $('#fAcc');
  if(!accSel._init){
    accSel.innerHTML = '<option value="all">全部账号</option>' + state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('') + '<option value="none">未分配</option>';
    accSel._init = true;
  }
  const stSel = $('#fStatus');
  if(!stSel._init){ stSel.innerHTML = '<option value="all">全部状态</option>' + STATUSES.map(s=>`<option>${s}</option>`).join(''); stSel._init = true; }

  const fa = accSel.value, fs = stSel.value, q = ($('#fSearch').value||'').trim().toLowerCase();
  const onlyLate = UI.lateOnly;

  let list = state.tasks.slice();
  if(fa !== 'all') list = list.filter(t => fa==='none' ? !t.accountId : t.accountId===fa);
  if(fs !== 'all') list = list.filter(t => t.status===fs);
  if(q) list = list.filter(t => (t.title||'').toLowerCase().includes(q) || (t.note||'').toLowerCase().includes(q));
  if(onlyLate) list = list.filter(t => t.status!=='已完成' && t.status!=='已搁置' && t.due < TODAY());
  list.sort((a,b)=> a.due===b.due ? (PRIOS.indexOf(a.priority)-PRIOS.indexOf(b.priority)) : (a.due<b.due?-1:1));

  $('#taskCount').textContent = `共 ${state.tasks.length} 条${onlyLate?' · 只看逾期':''}`;
  $('#fLate').classList.toggle('on', onlyLate);

  $('#taskBody').innerHTML = list.length ? list.map(t=>{
    const late = t.status!=='已完成' && t.status!=='已搁置' && t.due < TODAY();
    const today = t.due === TODAY();
    return `<tr>
      <td data-label="账号"><span class="dot" style="background:${accColor(t.accountId)};margin-right:6px"></span>${esc(accName(t.accountId))}</td>
      <td data-label="任务"><b>${esc(t.title)}</b>${t.note?`<div class="hint">${esc(t.note)}</div>`:''}</td>
      <td data-label="截止" class="${late?'due-late':(today?'due-today':'')}">${md(t.due)}${late?' 逾期':''}</td>
      <td data-label="状态"><span class="tag s${STATUSES.indexOf(t.status)}" data-act="editTask" data-id="${t.id}">${t.status}</span></td>
      <td data-label="优先级"><span class="tag p${PRIOS.indexOf(t.priority)}">${t.priority}</span></td>
      <td data-label="操作" style="white-space:nowrap">
        ${t.status!=='已完成'?`<button class="btn sm" data-act="quickDone" data-id="${t.id}">完成</button> `:''}
        <button class="btn sm ghost" data-act="editTask" data-id="${t.id}">改</button>
        <button class="btn sm ghost" data-act="delTask" data-id="${t.id}" title="删除">✕</button>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="6"><div class="empty"><div class="big">📋</div>没有符合条件的任务</div></td></tr>`;
}

/* ---------------- 渲染：报表台账 ---------------- */
function renderReports(){
  const t = TODAY();
  const ws = weekStartOf(t), we = addS(ws,6);
  const c = cycleFor(t);

  $('#repTodaySub').textContent = `${md(t)} ${DOW[P(t).getDay()]}`;

  const items = [];
  // 日报
  const now = new Date();
  const [hh,mm] = (state.due.daily||'18:00').split(':').map(Number);
  const dueDt = new Date(P(t).getFullYear(), P(t).getMonth(), P(t).getDate(), hh, mm, 0);
  const passed = now > dueDt;
  const leftMs = dueDt - now;
  const leftTxt = passed ? '已过截止 '+Math.floor(-leftMs/3600000)+' 小时' : `距截止 ${Math.floor(leftMs/3600000)} 小时 ${Math.floor(leftMs%3600000/60000)} 分`;
  const dk = rk.daily(t);
  items.push(repItem(dk, '📝', '日报', `每天 ${state.due.daily} 前填 · ${leftTxt}`, isFilled(dk), passed && !isFilled(dk), state.links.daily));

  // 台账
  activeAccounts().forEach(a=>{
    const k = rk.ledger(t, a.id);
    items.push(repItem(k, '📊', '台账 · '+a.name, '今天的视频台账', isFilled(k), false, a.ledgerUrl, a.color));
  });

  $('#repToday').innerHTML = items.join('');
  const doneN = items.filter((_,i)=>true).length; // placeholder
  $('#repTodayScore').innerHTML = '';

  // 本周 / 本月
  const wk = rk.weekly(ws), mo = rk.monthly(c);
  const weekDue = ['<span class="hint">截止 '+md(we)+' '+state.due.weekly+'</span>'];
  const monthDue = ['<span class="hint">截止 考核日 '+md(c.assess)+'</span>'];
  const pItems = [
    repItem(wk, '📅', '周报 '+md(ws)+'–'+md(we), '周期最后一天填', isFilled(wk), false, state.links.weekly),
    repItem(mo, '📆', '月报 '+cycleLabel(c), '考核日 '+md(c.assess), isFilled(mo), false, state.links.monthly)
  ];
  $('#repPeriod').innerHTML = pItems.join('');

  // 补填
  const miss = [];
  for(let i=1;i<=14;i++){
    const d = addS(t,-i); const k = rk.daily(d);
    if(!isFilled(k)) miss.push({k, txt:`日报 · ${md(d)} 周${DOW1[P(d).getDay()]}`, sub:'补勾'});
  }
  for(let i=1;i<=4;i++){
    const w0 = addS(ws,-7*i); const k = rk.weekly(w0);
    if(!isFilled(k)) miss.push({k, txt:`周报 · ${md(w0)}–${md(addS(w0,6))}`, sub:'补勾'});
  }
  state.cycles.filter(x=> x.end < t).forEach(cy=>{
    const k = rk.monthly(cy);
    if(!isFilled(k)) miss.push({k, txt:`月报 · ${cycleLabel(cy)}`, sub:'补勾'});
  });
  $('#makeupList').innerHTML = miss.length ? miss.slice(0,60).map(m=>`
    <div class="rep" style="padding:9px 11px">
      <div class="rmain"><div class="rt" style="font-size:12.5px">${m.txt}</div></div>
      <button class="chip" data-act="toggleReport" data-k="${m.k}">补勾</button>
    </div>`).join('') : `<div class="empty"><div class="big">✓</div>近期没有漏填的</div>`;

  // 热力图
  renderHeat(c);
}

function repItem(key, icon, title, sub, filled, overdue, url, color){
  return `<div class="rep ${filled?'filled':''} ${overdue?'overdue':''}">
    <div class="rice" style="${color?`color:${color}`:''}">${filled?'✓':icon}</div>
    <div class="rmain">
      <div class="rt">${esc(title)} ${filled?'<span class="pill ok" style="font-size:10.5px">已填</span>':(overdue?'<span class="pill bad" style="font-size:10.5px">已逾期</span>':'')}</div>
      <div class="rs">${sub}</div>
    </div>
    ${url?`<button class="btn sm" data-act="openLink" data-url="${esc(url)}">打开</button>`:`<button class="btn sm ghost" data-act="goSettings" title="去设置里加链接">加链接</button>`}
    <button class="check ${filled?'on':''}" data-act="toggleReport" data-k="${key}" title="标记${filled?'未填':'已填'}">${filled?'✓':''}</button>
  </div>`;
}

function renderHeat(c){
  const t = TODAY();
  const days = [];
  let cur = c.start;
  while(cur <= c.end){ days.push(cur); cur = addS(cur,1); }
  const accs = activeAccounts();
  $('#heatSub').textContent = `${cycleLabel(c)} · ${days.length} 天 · 点格子可切换`;
  const head = `<div class="hacc"></div>` + days.map(d=>{
    const n = P(d).getDate();
    const show = (n===1 || n%5===0);
    return `<div class="hlabel ${d===t?'':''}" style="width:20px;${d===t?'color:#2563eb;font-weight:700':''}">${show?n:''}</div>`;
  }).join('');
  const rows = accs.map(a=>{
    const cells = days.map(d=>{
      const on = isFilled(rk.ledger(d,a.id));
      const future = d > t;
      const cls = on ? 'on' : (future ? 'future' : 'miss');
      return `<button class="hc ${cls} ${d===t?'today':''}" data-act="toggleLedger" data-d="${d}" data-a="${a.id}" title="${a.name} ${md(d)}">${on?'✓':''}</button>`;
    }).join('');
    return `<div class="hacc" title="${esc(a.name)}"><span class="dot" style="background:${a.color};margin-right:5px"></span>${esc(a.name)}</div>` + cells;
  }).join('');
  $('#heatmap').innerHTML = `<div class="heat" style="grid-template-columns:110px repeat(${days.length},20px)">${head}${rows}</div>`;
}

    <div class="srow"><div class="sl">备份</div><div class="sr">
      <button class="btn" data-act="exportJson">导出备份 JSON</button>
      <label class="btn">导入备份<input type="file" accept=".json" id="importFile" hidden></label>
      <span class="hint">换电脑、清缓存前先导一份</span></div></div>
    <div class="srow"><div class="sl">重置</div><div class="sr">
      <button class="btn danger" data-act="resetAll">清空全部数据</button>
      <span class="hint">会清掉任务和勾选，账号配置也回到初始</span></div></div>
  </section>`;
}

/* ---------------- 主渲染 ---------------- */
const UI = {tab:'overview', lateOnly:false};
function render(){
  renderClock();
  renderOverview();
  renderTasks();
  renderReports();
  renderSettings();
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act],[data-tab]');
  if(!el) return;

  if(el.dataset.tab){
    UI.tab = el.dataset.tab;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===UI.tab));
    document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active', x.id==='view-'+UI.tab));
    return;
  }

  const act = el.dataset.act;
  const id = el.dataset.id;
  switch(act){
    case 'newTask': openDialog(); break;
    case 'editTask': openDialog(id); break;
    case 'delTask': {
      const t = state.tasks.find(x=>x.id===id);
      if(t && confirm('删除任务「'+t.title+'」？')){ state.tasks = state.tasks.filter(x=>x.id!==id); save(); render(); toast('已删除'); }
      break;
    }
    case 'quickDone': {
      const t = state.tasks.find(x=>x.id===id);
      if(t){ t.status='已完成'; save(); render(); toast('完成：'+t.title); }
      break;
    }
    case 'cycleStatus': {
      const t = state.tasks.find(x=>x.id===id);
      if(t){ t.status = STATUSES[(STATUSES.indexOf(t.status)+1)%STATUSES.length]; save(); render(); }
      break;
    }
    case 'genToday': genToday(); break;
    case 'goTasks': document.querySelector('[data-tab="tasks"]').click(); break;
    case 'goSettings': document.querySelector('[data-tab="settings"]').click(); break;
    case 'filter': renderTasks(); break;
    case 'toggleLate': UI.lateOnly = !UI.lateOnly; renderTasks(); break;
    case 'focusDay': openDialog(null, el.dataset.d); break;
    case 'toggleReport': toggleReport(el.dataset.k); break;
    case 'toggleLedger': {
      const k = rk.ledger(el.dataset.d, el.dataset.a);
      toggleReport(k);
      break;
    }
    case 'openLink': {
      const u = el.dataset.url;
      if(u){ window.open(u, '_blank'); } else { toast('还没填链接，去设置里加'); }
      break;
    }
    case 'moveWeek': {
      const cur = UI.weekStart || weekStartOf(TODAY());
      UI.weekStart = addS(cur, Number(el.dataset.n)*7);
      renderOverview();
      break;
    }
    case 'moveCycle': {
      const list = state.cycles.slice().sort((a,b)=> a.start<b.start?-1:1);
      const nowId = (UI.cycleId && list.some(c=>c.id===UI.cycleId)) ? UI.cycleId : cycleFor(TODAY()).id;
      let i = list.findIndex(c=>c.id===nowId);
      i = Math.min(list.length-1, Math.max(0, i + Number(el.dataset.n)));
      UI.cycleId = list[i].id;
      renderOverview();
      break;
    }
    case 'toggleAcc': {
      const a = accOf(id); if(a){ a.enabled = !a.enabled; save(); render(); }
      break;
    }
    case 'addAcc': {
      state.accounts.push({id:uid(), name:'新账号', kind:'合作', note:'', cadence:1,
        color:['#2563eb','#0d9488','#ea580c','#7c3aed','#db2777','#0891b2'][state.accounts.length%6], ledgerUrl:'', enabled:true});
      save(); render(); toast('已添加账号，记得改名');
      break;
    }
    case 'delAcc': {
      const a = accOf(id);
      if(a && confirm('删除账号「'+a.name+'」？该账号的任务会变成「未分配」。')){
        state.accounts = state.accounts.filter(x=>x.id!==id);
        state.tasks.forEach(t=>{ if(t.accountId===id) t.accountId=''; });
        save(); render();
      }
      break;
    }
    case 'addCycle': {
      const last = state.cycles.slice().sort((a,b)=> a.end<b.end?1:-1)[0];
      const start = last ? addS(last.end,1) : TODAY();
      state.cycles.push({id:uid(), label:'', start, end:addS(start,29), assess:addS(start,29), target:last?last.target:40});
      save(); render(); toast('已添加周期，请确认考核日');
      break;
    }
    case 'delCycle': {
      if(state.cycles.length<=1){ toast('至少保留一个周期'); break; }
      if(confirm('删除这个周期？')){ state.cycles = state.cycles.filter(c=>c.id!==id); save(); render(); }
      break;
    }
    case 'toggleRest': {
      const w = el.dataset.w, d = Number(el.dataset.d);
      const arr = state.restDays[w] || [];
      state.restDays[w] = arr.includes(d) ? arr.filter(x=>x!==d) : arr.concat(d);
      save(); render();
      break;
    }
    case 'togglePostRest': state.postOnRest = !state.postOnRest; save(); render(); break;
    case 'setWeekType': {
      const ws = weekStartOf(TODAY());
      state.overrides[ws] = el.dataset.t;
      save(); render(); toast('本周已标记为'+(el.dataset.t==='small'?'小周':'双周'));
      break;
    }
    case 'exportCsv': exportCsv(); break;
    case 'logout': if(confirm('退出登录？本机缓存会清除，云端数据还在。')) logout(); break;
    case 'exportJson': exportJson(); break;
    case 'resetAll': {
      if(confirm('确定清空全部数据？此操作不可恢复。')){
        localStorage.removeItem(KEY); state = seed(); save(); render(); toast('已重置');
      }
      break;
    }
  }
});

document.addEventListener('change', function(e){
  const el = e.target;
  const kind = el.dataset.kind, id = el.dataset.id, field = el.dataset.field;
  if(!kind || !field) return;
  let val = el.value;
  if(el.type==='number') val = Number(val)||0;

  if(kind==='acc'){
    const a = accOf(id);
    if(a){ a[field] = val; if(field==='cadence') a.cadence = Math.max(0, Number(val)||0); save(); renderClock(); renderOverview(); renderReports(); renderSettings(); }
  } else if(kind==='cycle'){
    const c = state.cycles.find(x=>x.id===id);
    if(c){
      c[field] = val;
      if(c.start > c.end) c.end = c.start;
      if(field==='start'||field==='end'){ c.label = cycleLabel(c); if(c.assess < c.start) c.assess = c.end; }
      save(); render();
    }
  } else if(kind==='cfg'){
    state.due[field] = val; save(); render();
  } else if(kind==='link'){
    state.links[field] = val; save(); renderReports();
  }
});

function genToday(){
  const t = TODAY();
  if(dailyTarget(t)===0 && !confirm('今天是休息日，确定还要生成任务吗？')) return;
  let n = 0;
  activeAccounts().forEach(a=>{
    const dup = state.tasks.some(x=> x.accountId===a.id && x.due===t);
    if(!dup){ state.tasks.push({id:uid(), accountId:a.id, title:'日常更新', due:t, status:'未开始', priority:'中', note:''}); n++; }
  });
  save(); render();
  toast(n ? `已生成 ${n} 条今日任务` : '今天每个账号都已有任务了');
}

/* ---------------- 弹窗 ---------------- */
let editingId = null;
function openDialog(id, presetDue){
  editingId = id || null;
  const accSel = $('#f-account');
  accSel.innerHTML = '<option value="">未分配（其他工作）</option>' + state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
  const t = id ? state.tasks.find(x=>x.id===id) : null;
  $('#dlgTitle').textContent = t ? '编辑任务' : (presetDue ? '新增任务 · '+md(presetDue) : '新增任务');
  $('#f-title').value = t ? t.title : '';
  $('#f-account').value = t ? (t.accountId||'') : (activeAccounts()[0] ? activeAccounts()[0].id : '');
  $('#f-due').value = t ? t.due : (presetDue || TODAY());
  $('#f-status').value = t ? t.status : '未开始';
  $('#f-pri').value = t ? t.priority : '中';
  $('#f-note').value = t ? (t.note||'') : '';
  $('#dlg').showModal();
  setTimeout(()=> $('#f-title').focus(), 50);
}
$('#btnSave').addEventListener('click', function(){
  const title = $('#f-title').value.trim();
  if(!title){ toast('任务名不能为空'); return; }
  const data = {
    accountId: $('#f-account').value,
    title,
    due: $('#f-due').value || TODAY(),
    status: $('#f-status').value,
    priority: $('#f-pri').value,
    note: $('#f-note').value.trim()
  };
  if(editingId){
    Object.assign(state.tasks.find(x=>x.id===editingId), data);
  } else {
    state.tasks.push(Object.assign({id:uid()}, data));
  }
  save(); render(); $('#dlg').close();
  toast(editingId ? '已保存' : '已新增任务');
});

/* ---------------- 导出 ---------------- */
function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function exportCsv(){
  const t = TODAY();
  const ws = weekStartOf(t), we = addS(ws,6);
  const c = cycleFor(t);
  const rows = [];
  const push = arr => rows.push(arr.map(csvCell).join(','));

  push(['视频运营工作台 导出', new Date().toLocaleString('zh-CN')]);
  push([]);
  push(['【任务明细】']);
  push(['账号','任务','截止日期','状态','优先级','备注']);
  state.tasks.slice().sort((a,b)=> a.due<b.due?-1:1).forEach(x=>{
    push([accName(x.accountId), x.title, x.due, x.status, x.priority, x.note||'']);
  });
  push([]);
  push(['【本周汇总】', md(ws)+'–'+md(we)]);
  push(['应有','已完成','完成率']);
  push([sumTarget(ws,we), doneIn(ws,we), pct(doneIn(ws,we), sumTarget(ws,we))+'%']);
  push([]);
  push(['【本周期汇总】', cycleLabel(c)]);
  push(['考核日','保底目标','已完成','按日更推算']);
  push([c.assess, c.target, doneIn(c.start,c.end), sumTarget(c.start,c.end)]);
  push([]);
  push(['【账号明细】']);
  push(['账号','本周期完成','本周完成','今日完成']);
  activeAccounts().forEach(a=>{
    push([a.name, doneIn(c.start,c.end,a.id), doneIn(ws,we,a.id), doneIn(t,t,a.id)]);
  });
  push([]);
  push(['【报表台账】']);
  push(['类型','周期','状态']);
  push(['日报', t, isFilled(rk.daily(t))?'已填':'未填']);
  push(['周报', md(ws)+'–'+md(we), isFilled(rk.weekly(ws))?'已填':'未填']);
  push(['月报', cycleLabel(c), isFilled(rk.monthly(c))?'已填':'未填']);
  activeAccounts().forEach(a=>{
    push(['台账 · '+a.name, t, isFilled(rk.ledger(t,a.id))?'已填':'未填']);
  });

  download('工作台导出_'+t+'.csv', '\ufeff'+rows.join('\r\n'), 'text/csv;charset=utf-8');
  toast('已导出 CSV');
}
function exportJson(){
  download('工作台备份_'+TODAY()+'.json', JSON.stringify(state,null,2), 'application/json');
  toast('已导出备份');
}
document.addEventListener('change', function(e){
  if(e.target.id !== 'importFile') return;
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(!s.accounts || !s.tasks) throw new Error('格式不对');
      state = Object.assign(seed(), s); save(); render(); toast('导入成功');
    }catch(err){ alert('导入失败：'+err.message); }
  };
  r.readAsText(f);
});

/* ---------------- 启动 ---------------- */
function init(){
  state = load();
  render();
  $('#authLogin').addEventListener('click', function(){ doLogin(false); });
  $('#authSignup').addEventListener('click', function(){ doLogin(true); });
  $('#authPass').addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(false); });
  $('#authEmail').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('#authPass').focus(); });
  bootAuth();
  $('#fSearch').addEventListener('input', renderTasks);
  $('#fAcc').addEventListener('change', renderTasks);
  $('#fStatus').addEventListener('change', renderTasks);
  setInterval(()=>{
    const before = TODAY();
    renderClock();
    if(before !== UI._day){ UI._day = before; render(); }
  }, 1000);
  UI._day = TODAY();
  // 每分钟轻量刷新一次（倒计时/逾期）
  setInterval(()=>{ renderOverview(); }, 60000);
}
init();

window.addEventListener('error', function(e){
  console.error(e.error||e.message);
});
})();
</script>
